name: Signed APK release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v0.2.0-alpha.1; must match versionName'
        required: true
        type: string
      prerelease:
        description: 'Mark this as a development prerelease'
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  release:
    # Only an explicit dispatch on main can use the signing environment.
    if: github.ref == 'refs/heads/main'
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate tag and select source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid version tag'; exit 1; }
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          git checkout --detach "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$RELEASE_TAG" = "v$VERSION"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Install Vulkan shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslc ninja-build
      - name: Fetch verified sources and check reader
        run: |
          npm ci
          python3 scripts/fetch_upstream.py
          python3 scripts/fetch_llama.py
          npm test
          npm run check:reader
          npm run test:android-web
          npx playwright install --with-deps chromium
          npm run test:reader
      - name: Restore private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Configure the four Android signing secrets'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pararead-release.jks"
      - name: Build and validate signed release APK
        env:
          PARAREAD_KEYSTORE_PATH: ${{ runner.temp }}/pararead-release.jks
          PARAREAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PARAREAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PARAREAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :core:test :engine:llama:testDebugUnitTest :app:assembleRelease :app:lintRelease
          mkdir -p artifacts
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > artifacts/release-runtime-dependencies.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release.apk
          python3 scripts/prepare_apk.py --variant release --dependencies artifacts/release-runtime-dependencies.txt
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=()
          if [ "$IS_PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/distribution/* --verify-tag --draft "${flags[@]}" --title "ParaRead Android $RELEASE_TAG" --notes-file docs/release-notes.md
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pararead-release.jks"
