name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Fetch verified source dependencies
        run: |
          npm ci
          python3 scripts/fetch_upstream.py
          python3 scripts/fetch_llama.py
      - name: Reader checks
        run: |
          npm test
          npm run check:reader
          npm run test:android-web
          npx playwright install --with-deps chromium
          npm run test:reader
      - name: Build ARM64 debug APK and run checks
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug
      - name: Verify and package artifacts
        run: |
          mkdir -p artifacts
          ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > artifacts/debug-runtime-dependencies.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/prepare_apk.py --dependencies artifacts/debug-runtime-dependencies.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pararead-android-debug-arm64
          path: artifacts/distribution/*
          if-no-files-found: error
          retention-days: 14
